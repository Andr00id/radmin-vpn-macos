name: Linux build check

# The Linux side of the shared sources (src/tap_bridge.c, the PE components)
# must keep building; releases of this repository are the macOS ones
# (see macos.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 libgtk-4-dev file upx-ucl

      - name: Build binaries
        run: make

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: radmin-vpn-linux-binaries
          path: |
            build/rvpnnetmp.sys
            build/adapter_hook.dll
            build/rvpn_launcher.exe
            build/netsh.exe
            build/netsh64.exe
            build/drvinst.exe
            build/tap_bridge
            build/rvpn_filter_ui
            build/rvpn_dnsfix.so
            build/rvpn_reuseport.so
