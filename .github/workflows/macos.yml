name: macOS build

# Every push builds the macOS package; a v* tag also publishes it as a release
# (radmin-vpn-macos-<tag>.zip / .tar.gz plus SHA256SUMS).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: brew install mingw-w64

      - name: Build
        run: make -f Makefile.macos

      - name: Check the scripts parse under macOS's bash 3.2
        run: |
          /bin/bash -n run_macos.sh
          /bin/bash -n macos_guard.sh
          /bin/bash -n lib.sh

      - name: Package
        run: ./packaging/package-macos.sh "${GITHUB_REF_NAME//\//-}"

      - uses: actions/upload-artifact@v4
        with:
          name: radmin-vpn-macos
          path: packaging/dist/radmin-vpn-macos-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: radmin-vpn-macos
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          generate_release_notes: true
